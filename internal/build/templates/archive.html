<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a">
<style>body{max-width:720px;margin:0 auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.5}nav{text-align:center;font-size:0.875em}img{max-width:100%;height:auto}</style>
<script type="speculationrules">{"prerender":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
<title>Archive — {{.Publication.Name}}</title>
<link rel="canonical" href="{{.Publication.URL}}/archive/">

{{range .Publication.SocialLinks}}<link rel="me" href="{{.}}">
{{end}}{{if .Publication.FaviconPath}}<link rel="icon" href="{{.Publication.FaviconPath}}">{{end}}
</head>
<body>
<header>
<h1>Archive</h1>
<p><a href="{{.Publication.URL}}/">← {{.Publication.Name}}</a></p>
</header>
{{if .Years}}
{{range .Years}}<section>
<h2>{{.Year}}</h2>
<ul>
{{range .Posts}}<li><time datetime="{{.PublishedAt.Format "2006-01-02"}}">{{.PublishedAt.Format "Jan 2"}}</time> &mdash; <a href="{{.Path}}/">{{.Title}}</a></li>
{{end}}</ul>
</section>
{{end}}{{else}}
<p>No posts yet.</p>
{{end}}
</body>
</html>
