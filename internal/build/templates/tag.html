<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a">
<style>body{max-width:720px;margin:0 auto;padding:1rem;font-family:system-ui,sans-serif;line-height:1.5}nav{text-align:center;font-size:0.875em}img{max-width:100%;height:auto}</style>
<script type="speculationrules">{"prerender":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
<title>Posts tagged "{{.Tag}}" — {{.Publication.Name}}</title>
<link rel="canonical" href="{{.Publication.URL}}/tags/{{.Tag}}/">

<meta property="og:title" content="Posts tagged &quot;{{.Tag}}&quot; — {{.Publication.Name}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{.Publication.URL}}/tags/{{.Tag}}/">
<meta property="og:site_name" content="{{.Publication.Name}}">

{{range .Publication.SocialLinks}}<link rel="me" href="{{.}}">
{{end}}{{if .Publication.FaviconPath}}<link rel="icon" href="{{.Publication.FaviconPath}}">{{end}}

<link rel="alternate" type="application/atom+xml" title="{{.Publication.Name}}" href="{{.Publication.URL}}/feed.xml">
</head>
<body>
<header>
<h1>Posts tagged &ldquo;{{.Tag}}&rdquo;</h1>
<p><a href="{{.Publication.URL}}/tags/">All tags</a> &middot; <a href="{{.Publication.URL}}/">{{.Publication.Name}}</a></p>
</header>
<ul>
{{range .Posts}}<li><time datetime="{{.PublishedAt.Format "2006-01-02"}}">{{.PublishedAt.Format "Jan 2 2006"}}</time> &mdash; <a href="{{.Path}}/">{{.Title}}</a></li>
{{end}}</ul>
</body>
</html>
